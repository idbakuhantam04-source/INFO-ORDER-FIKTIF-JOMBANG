<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Radar Order Fiktif - Jombang</title>
<style>
:root{--bg:#FFF8E6;--card:#fff;--tx:#2b2412;--mut:#6f6140;--pri:#1d6b4f;--pritx:#fff;--bd:#efdca8;--ok:#1f7a5a;--mid:#b7791f;--bad:#c0392b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark) and (min-width:99999px){:root:not([data-theme="light"]){--bg:#121a17;--card:#1b2622;--tx:#e8f0ec;--mut:#9fb0a9;--pri:#3fb88e;--pritx:#07130e;--bd:#2c3b35;--ok:#3fb88e;--mid:#e0a63a;--bad:#ef6a5b}}
:root[data-theme="dark"]{--bg:#121a17;--card:#1b2622;--tx:#e8f0ec;--mut:#9fb0a9;--pri:#3fb88e;--pritx:#07130e;--bd:#2c3b35;--ok:#3fb88e;--mid:#e0a63a;--bad:#ef6a5b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.45}
.wrap{max-width:560px;margin:0 auto;padding:16px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.top a{color:var(--pri);text-decoration:none;font-weight:600;font-size:14px}
h1{font-size:26px;margin:12px 0 4px}
h2{font-size:18px;margin:22px 0 10px}
p.sub{color:var(--mut);margin:0 0 16px}
.btn{display:block;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px 16px;margin-bottom:10px;color:var(--tx);text-decoration:none}
.btn b{display:block;font-size:16px}.btn span{color:var(--mut);font-size:14px}
.btn.p{background:var(--pri);color:var(--pritx);border-color:var(--pri)}.btn.p span{color:var(--pritx);opacity:.85}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:10px}
label{display:block;font-weight:600;font-size:14px;margin:12px 0 4px}
input,select,textarea{width:100%;padding:11px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}
.chk{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--bd);font-size:15px}
.chk input{width:20px;height:20px;margin-top:2px;flex:none}
button.go{width:100%;margin-top:14px;padding:13px;border:0;border-radius:12px;background:var(--pri);color:var(--pritx);font:inherit;font-weight:700;cursor:pointer}
button.sec{background:transparent;color:var(--bad);border:1px solid var(--bad)}
.res{border-left:6px solid var(--ok)}.res.mid{border-color:var(--mid)}.res.bad{border-color:var(--bad)}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;background:var(--bg);color:var(--mut);margin-right:6px}
.meta{color:var(--mut);font-size:13px;margin-top:4px}
.back{display:inline-block;margin-bottom:6px;color:var(--pri);text-decoration:none;font-weight:600}
.note{font-size:13px;color:var(--mut);margin-top:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:flex;align-items:center;gap:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:99px;padding:10px 16px;font:inherit;font-weight:600;cursor:pointer}
.chip i{width:12px;height:12px;border-radius:50%;display:inline-block}
.chip.on{background:var(--pri);color:var(--pritx);border-color:var(--pri)}
.opt{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:13px 14px;margin-bottom:8px;font-size:15px;cursor:pointer}
.opt input{width:20px;height:20px;flex:none;accent-color:var(--pri)}
.opt:has(input:checked){border-color:var(--pri);border-width:2px;padding:12px 13px}
h3{font-size:15px;margin:20px 0 8px}
.btn2{display:block;width:100%;margin-top:8px;padding:12px;border:1px solid var(--bd);border-radius:12px;background:var(--card);color:var(--tx);font:inherit;font-weight:600;cursor:pointer}
.go.red{background:var(--bad);color:#fff}
.tpl b{display:block;margin-bottom:6px}.tpl p{margin:0;color:var(--mut);font-size:14px}
.wrap{position:relative}
.gear{position:absolute;right:16px;top:16px;width:48px;height:48px;border-radius:50%;border:0;background:var(--card);color:var(--tx);display:grid;place-items:center;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.big{font-size:36px;line-height:1.05;margin:36px 60px 8px 0;font-weight:800}
.stat{margin:14px 0 18px}
.srch{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:99px;padding:0 18px;box-shadow:0 2px 10px rgba(0,0,0,.08);margin-bottom:18px;color:var(--mut)}
.srch input{border:0;background:transparent;padding:16px 0;outline:0}
.dual{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:20px}
.big2{border-radius:26px;padding:18px;text-decoration:none;display:block;background:var(--card);color:var(--tx);box-shadow:0 2px 10px rgba(0,0,0,.08);min-height:150px}
.big2.d{background:#3a5f58;color:#fff}
.big2 .ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:rgba(128,128,128,.15);margin-bottom:22px}
.big2.d .ic{background:rgba(255,255,255,.18)}
.big2 b{display:block;font-size:18px}.big2 span{display:block;font-size:14px;opacity:.75;margin-top:6px}
.apps{display:flex;gap:12px;overflow-x:auto;padding-bottom:4px;margin-bottom:8px}
.ap{border:0;background:transparent;color:var(--mut);font:inherit;font-weight:600;font-size:13px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;flex:none;width:64px}
.ap.on{color:var(--tx)}
.tl{width:60px;height:60px;border-radius:18px;display:grid;place-items:center;font-weight:800;font-size:24px;color:#fff;position:relative}
.ap.on .tl{outline:3px solid var(--pri);outline-offset:2px}
.row{display:flex;gap:14px;background:var(--card);border-radius:26px;padding:16px;margin-bottom:12px;box-shadow:0 2px 10px rgba(0,0,0,.08)}
.row .lt{display:flex;flex-direction:column;align-items:center;gap:6px;flex:none}
.row .tl{width:64px;height:64px}
.kb{font-size:12px;font-weight:700;background:var(--bg);border-radius:99px;padding:3px 9px;white-space:nowrap}
.row .rt{flex:1;min-width:0}
.row .rt b{display:block;font-size:16px;overflow-wrap:anywhere}
.row .m{color:var(--mut);font-size:13px;margin-top:4px}
.row .bt{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-top:8px}
.row .bt strong{font-size:17px;white-space:nowrap}
.hd{display:flex;justify-content:space-between;align-items:baseline}.hd h2{margin:16px 0 10px;font-size:22px}
body{background:linear-gradient(180deg,#FFE29A,#FFF6DC 340px,#FFF6DC) fixed}
.hero{display:block;width:100%;height:auto;border-radius:26px;box-shadow:0 4px 14px rgba(180,120,0,.25)}
.big{margin-top:16px;color:#14543d}
.big2.d,.ap:first-child .tl{background:#1d6b4f!important}
.big2{border:1px solid var(--bd)}
.row{border:1px solid var(--bd);border-left:6px solid #F29E2E}
.kb{background:#FFE9B5;color:#7a4a00}
.foot{text-align:center;color:var(--mut);font-size:13px;margin:22px 0 8px}
.set{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--bd);border-radius:26px;padding:16px;margin-bottom:12px;text-decoration:none;color:var(--tx);box-shadow:0 2px 10px rgba(0,0,0,.08);width:100%;text-align:left;font:inherit;cursor:pointer}
.set .ib{width:56px;height:56px;border-radius:18px;background:#FFF1C9;display:grid;place-items:center;flex:none;color:#14543d}
.set b{display:block;font-size:17px}.set span.s{display:block;color:var(--mut);font-size:14px;margin-top:2px}.set .tx{flex:1}
.num{width:30px;height:30px;border-radius:50%;background:#c0392b;color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
</style>
</head>
<body>
<div class="wrap">
<button class="gear" aria-label="Setelan" onclick="location.hash='#setelan'"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg></button>
<div id="app"></div>
</div>
<script>
var KEC=["Jombang","Diwek","Peterongan","Mojoagung","Mojowarno","Sumobito","Perak","Bareng","Ngoro","Gudo","Kabuh","Kesamben","Ploso","Plandaan","Ngusikan","Kudu","Megaluh","Tembelang","Jogoroto","Wonosalam","Bandar Kedungmulyo"];
var APL=["Ojek online","Kurir paket","Antar makanan","Lainnya"];
var SIG=[["Akun pemesan baru / tanpa riwayat",2],["Nomor HP tidak bisa dihubungi",3],["Alamat tidak jelas / tanpa patokan",2],["Minta dibelikan dulu (talangan)",3],["COD dengan nominal besar",2],["Chat tidak nyambung / menolak telepon",2],["Titik antar berubah-ubah",1],["Pesanan tidak masuk akal (jumlah atau jenis)",2]];
var KEY="radar_jombang_reports",app=document.getElementById("app");
/* === PENGATURAN DATABASE BERSAMA (Firebase Realtime Database) ===
   Isi FB dengan URL database kamu, contoh: "https://nama-proyek-default-rtdb.asia-southeast1.firebasedatabase.app"
   Kosongkan ("") untuk mode lokal (laporan tersimpan di HP masing-masing). */
var FB="https://radar-fiktif-jombang-default-rtdb.asia-southeast1.firebasedatabase.app";
var REP=null;
function fbOn(){return typeof FB==="string"&&FB.indexOf("https://")===0}
function load(){if(fbOn())return REP||[];try{return JSON.parse(localStorage.getItem(KEY))||[]}catch(e){return[]}}
function save(a){if(fbOn()){if(!a.length){alert("Untuk menghapus laporan, buka Firebase Console → Realtime Database → hapus data 'reports'.");return}
a.forEach(function(x){if(!x.id){x.id="n";fetch(FB.replace(/\/$/,"")+"/reports.json",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(x)}).then(function(r){if(!r.ok)throw 0;poll()}).catch(function(){alert("Laporan gagal dikirim. Cek koneksi internet.")})}});REP=a;return}
try{localStorage.setItem(KEY,JSON.stringify(a))}catch(e){}}
function poll(){if(!fbOn())return;fetch(FB.replace(/\/$/,"")+"/reports.json").then(function(r){return r.json()}).then(function(d){REP=d?Object.keys(d).map(function(k){var o=d[k]||{};o.id=k;return o}):[];var h=location.hash;if(h==="#lapor"||h==="#cek")return;if(document.activeElement&&document.activeElement.id==="q"&&document.getElementById("lst"))rl();else route()}).catch(function(){})}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function opts(a){return a.map(function(x){return"<option>"+esc(x)+"</option>"}).join("")}
function ago(t){var m=Math.floor((Date.now()-t)/6e4);if(m<1)return"baru saja";if(m<60)return m+" menit lalu";var h=Math.floor(m/60);if(h<24)return h+" jam lalu";return Math.floor(h/24)+" hari lalu"}
function home(){var r=load().slice().reverse().slice(0,10);
app.innerHTML='<h1>Radar Order Fiktif Jombang</h1><p class="sub">Cek dulu sebelum jalan, hemat bensin.</p>'+
'<a class="btn p" href="#cek"><b>Cek risiko order</b><span>Nilai orderan yang baru masuk</span></a>'+
'<a class="btn" href="#lapor"><b>Lapor order fiktif</b><span>Biar driver lain tidak zonk</span></a>'+
'<h2>Laporan terbaru</h2>'+(r.length?r.map(function(x){return'<div class="card"><span class="tag">'+esc(x.kec)+'</span><span class="tag">'+esc(x.apl)+'</span>'+(x.hp?'<span class="tag">HP ***'+esc(x.hp)+'</span>':'')+'<div style="margin-top:8px">'+esc(x.ket||"Tanpa keterangan")+'</div><div class="meta">'+ago(x.t)+'</div></div>'}).join(""):'<div class="card meta">Belum ada laporan.</div>')}
function cek(){app.innerHTML='<a class="back" href="#">← Kembali</a><h1>Cek risiko order</h1><p class="sub">Centang tanda-tanda yang kamu temui.</p>'+
'<div class="card"><label>Kecamatan tujuan</label><select id="k">'+opts(KEC)+'</select><label>4 digit terakhir nomor HP (opsional)</label><input id="h" inputmode="numeric" maxlength="4" placeholder="mis. 1234">'+
'<div style="margin-top:10px">'+SIG.map(function(s,i){return'<label class="chk"><input type="checkbox" data-i="'+i+'"><span>'+esc(s[0])+'</span></label>'}).join("")+'</div>'+
'<button class="go" id="nilai">Nilai order</button></div><div id="out"></div>';
document.getElementById("nilai").onclick=function(){var sc=0,n=0;document.querySelectorAll("[data-i]").forEach(function(c){if(c.checked){sc+=SIG[c.dataset.i][1];n++}});
var h=document.getElementById("h").value.trim(),hit=0;if(/^\d{4}$/.test(h)){hit=load().filter(function(x){return x.hp===h}).length;sc+=hit*4}
var cls=sc>=8?"bad":sc>=4?"mid":"",t=sc>=8?"Risiko tinggi":sc>=4?"Risiko sedang":"Risiko rendah";
var s=sc>=8?"Sebaiknya jangan diambil, atau konfirmasi lewat telepon dulu.":sc>=4?"Hubungi pemesan dan pastikan alamat sebelum jalan.":"Tetap konfirmasi alamat singkat sebelum berangkat.";
document.getElementById("out").innerHTML='<div class="card res '+cls+'"><b style="font-size:18px">'+t+' (skor '+sc+')</b><div>'+s+'</div>'+(hit?'<div class="meta">Nomor ini muncul di '+hit+' laporan.</div>':'')+'<div class="meta">Hasil hanya perkiraan, bukan kepastian.</div></div>'}}
function lapor(){app.innerHTML='<a class="back" href="#">← Kembali</a><h1>Lapor order fiktif</h1><p class="sub">Jangan tulis nama atau alamat lengkap pelanggan.</p>'+
'<div class="card"><label>Kecamatan</label><select id="k">'+opts(KEC)+'</select><label>Jenis layanan</label><select id="a">'+opts(APL)+'</select><label>4 digit terakhir nomor HP (opsional)</label><input id="h" inputmode="numeric" maxlength="4"><label>Kejadian singkat</label><textarea id="t" rows="4" maxlength="300" placeholder="Contoh: alamat tidak ada, nomor tidak aktif"></textarea><button class="go" id="kirim">Kirim laporan</button></div>';
document.getElementById("kirim").onclick=function(){var h=document.getElementById("h").value.trim();if(h&&!/^\d{4}$/.test(h)){alert("Isi tepat 4 digit angka.");return}
var a=load();a.push({kec:document.getElementById("k").value,apl:document.getElementById("a").value,hp:h,ket:document.getElementById("t").value.trim(),t:Date.now()});save(a);location.hash="#"}}
var APPS=["Shopee","Gojek","Grab","Maxim","ACI","Lainnya"],DOT={Shopee:"#ee4d2d",Gojek:"#00aa13",Grab:"#00b14f",Maxim:"#f5c400",ACI:"#2563eb",Lainnya:"#6b7a99"};
var KAT=["Alamat palsu / tanah kosong","Nomor tidak aktif / tidak diangkat","Minta talangan pulsa / top-up / transfer","Akun baru mencurigakan","Dibatalkan sepihak setelah sampai","Lainnya"];
function chips(id){return'<div class="chips" id="'+id+'">'+APPS.map(function(a,i){return'<button type="button" class="chip'+(i?'':' on')+'" data-v="'+a+'">'+(LG[a]?'<img src="'+LG[a]+'" alt="" style="width:24px;height:24px;border-radius:7px;object-fit:contain;background:#fff">':'<i style="background:'+DOT[a]+'"></i>')+''+a+'</button>'}).join("")+'</div>'}
function bindChips(id){var el=document.getElementById(id);el.onclick=function(e){var b=e.target.closest(".chip");if(!b)return;el.querySelectorAll(".chip").forEach(function(c){c.classList.remove("on")});b.classList.add("on")}}
function chipVal(id){return document.querySelector("#"+id+" .chip.on").dataset.v}
var G=[["Nominal order dan talangan",[["Di bawah 50rb, tanpa talangan / non-tunai",0],["50rb – 150rb, tunai / COD wajar",1],["Di atas 150rb tunai / resto harga tidak wajar",3],["Minta talangan pulsa / top-up e-wallet / transfer",5]]],["Titik antar",[["Ruko / perumahan jelas / mall / kantor / kampus",0],["Alamat tidak lengkap (hanya nama jalan / patokan umum)",2],["Gang sepi / lahan kosong / dekat kuburan / pinggir rel",4]]],["Akun customer",[["Akun lama, ada rating / sering order",0],["Akun baru, nama huruf acak (misal: x***z / user123)",3]]],["Pas di-chat di aplikasi",[["Langsung dibalas, nyambung, dan mau kirim ShareLoc",0],["Centang satu / belum dibaca, tapi baru 1–2 menit",1],["Dibaca doang / ngotot suruh lanjut ke WA pribadi",4]]],["Pas ditelepon lewat aplikasi",[["Diangkat, suara jelas dan kooperatif",0],["Tidak diangkat / langsung direject berkali-kali",3],["Nomor tidak aktif / dialihkan / suara mencurigakan",5]]]];
var T=[["Minta ShareLoc sebelum jalan","Halo Kak, maaf akhir-akhir ini marak order fiktif 🙏 Boleh tolong kirim ShareLoc posisi kakak sekarang lewat fitur Lokasi di chat aplikasi ini? Biar saya langsung meluncur dan tidak nyasar. Terima kasih Kak."],["Konfirmasi OTW dan standby telepon","Kak, pesanan sudah sesuai ya, saya OTW ke titik antar. Mohon standby HP-nya ya Kak, kalau saya telepon lewat aplikasi pas sudah dekat mohon diangkat biar cepat ketemu 🙏"],["Tolak talangan atau transfer di luar aplikasi","Maaf Kak, sesuai aturan kemitraan saya tidak bisa memproses titip beli pulsa, top-up saldo, atau transfer uang di luar rincian aplikasi. Pembayaran dan pesanan hanya mengikuti yang tertera di aplikasi ya Kak 🙏"]];
function cek(){app.innerHTML='<a class="back" href="#">← Kembali</a><h1>Cek risiko order</h1><p class="sub">Pilih aplikasi dan ciri-ciri orderan yang baru masuk di HP kamu.</p><h3>Aplikasi ojol</h3>'+chips("ca")+G.map(function(g,gi){return'<h3>'+esc(g[0])+'</h3>'+g[1].map(function(o,oi){return'<label class="opt"><input type="radio" name="g'+gi+'" value="'+oi+'"'+(oi?'':' checked')+'><span>'+esc(o[0])+'</span></label>'}).join("")}).join("")+'<button class="go" id="nilai">Hitung risiko</button><div id="out" style="margin-top:12px"></div><h2>Template chat</h2><p class="sub">Berlaku untuk semua aplikasi. Salin, lalu tempel di chat aplikasi.</p>'+T.map(function(t,i){return'<div class="card tpl"><b>'+esc(t[0])+'</b><p>'+esc(t[1])+'</p><button class="btn2" data-c="'+i+'">Salin template</button></div>'}).join("");
bindChips("ca");
document.getElementById("nilai").onclick=function(){var sc=0,why=[];G.forEach(function(g,gi){var o=g[1][+document.querySelector('input[name="g'+gi+'"]:checked').value];sc+=o[1];if(o[1]>=3)why.push(o[0])});
var cls=sc>=9?"bad":sc>=4?"mid":"",t=sc>=9?"Risiko tinggi":sc>=4?"Risiko sedang":"Risiko rendah",s=sc>=9?"Sebaiknya jangan diambil, atau kirim template tolak/ShareLoc dulu.":sc>=4?"Minta ShareLoc dan konfirmasi lewat telepon sebelum jalan.":"Aman untuk jalan, tetap standby telepon saat dekat.";
document.getElementById("out").innerHTML='<div class="card res '+cls+'"><b style="font-size:18px">'+t+' (skor '+sc+' dari 21) · '+esc(chipVal("ca"))+'</b><div>'+s+'</div>'+(why.length?'<div class="meta">Tanda bahaya: '+why.map(esc).join("; ")+'</div>':'')+'<div class="meta">Hasil hanya perkiraan, bukan kepastian.</div></div>'};
app.onclick=function(e){var b=e.target.closest("[data-c]");if(!b)return;var tx=T[b.dataset.c][1];function ok(){b.textContent="Tersalin ✓"}try{navigator.clipboard.writeText(tx).then(ok,ok)}catch(x){ok()}}}
function lapor(){var pos=null;app.innerHTML='<a class="back" href="#">← Kembali</a><h1>Lapor order fiktif</h1><p class="sub">Biar dulur driver lain tidak kena zonk di alamat yang sama.</p><h3>Aplikasi terkait</h3>'+chips("la")+'<label>Kecamatan</label><select id="k">'+opts(KEC)+'</select><label>Kategori modus</label><select id="m">'+opts(KAT)+'</select><label>Alamat atau titik antar fiktif</label><input id="al" maxlength="120" placeholder="Jl. Merdeka Gg. Melati (ujung dekat kebun kosong)"><button type="button" class="btn2" id="gps">📍 Pakai lokasiku sekarang</button><div class="note" id="gs">Opsional. Pakai kalau kamu sedang berada di titik antar, supaya laporan bisa dibuka di peta.</div><label>Nama akun atau no. WA</label><input id="ak" maxlength="40" placeholder="r***a / 0812-xxxx-4412"><label>Nominal kerugian atau order</label><input id="nm" maxlength="20" placeholder="Rp 185.000"><label>Kronologi singkat</label><textarea id="t" rows="4" maxlength="300" placeholder="Order 4 paket ayam geprek tunai, chat tidak dibalas, ditelepon tidak aktif, sampai titik ternyata lahan kosong."></textarea><button class="go red" id="kirim">🚩 Simpan laporan</button><div class="note">Samarkan nama dan nomor pelanggan (contoh r***a).</div>';
bindChips("la");

function peta(){var p=load().filter(function(x){return typeof x.lat==="number"}),h='<a class="back" href="#setelan">← Kembali</a><h1>Peta titik fiktif</h1><p class="sub">'+p.length+' titik ditandai dari lokasi GPS laporan.</p>';
if(!p.length){app.innerHTML=h+'<div class="card meta">Belum ada titik. Saat melapor, ketuk "Pakai lokasiku sekarang" di titik antar.</div>';return}
var la=p.map(function(x){return x.lat}),lo=p.map(function(x){return x.lng}),a=Math.min.apply(null,la),b=Math.max.apply(null,la),c=Math.min.apply(null,lo),d=Math.max.apply(null,lo),W=340,H=240,pd=30;
function X(v){return d===c?W/2:pd+(v-c)/(d-c)*(W-2*pd)}function Y(v){return b===a?H/2:H-pd-(v-a)/(b-a)*(H-2*pd)}
var sv='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;display:block"><rect width="'+W+'" height="'+H+'" rx="20" fill="#FFF1C9"/><path d="M0 '+(H*.6)+'Q'+W/3+' '+(H*.45)+' '+W/2+' '+(H*.6)+'T'+W+' '+(H*.55)+'" stroke="#E8CF8E" stroke-width="10" fill="none"/>'+p.map(function(x,i){return'<circle cx="'+X(x.lng).toFixed(1)+'" cy="'+Y(x.lat).toFixed(1)+'" r="12" fill="#c0392b"/><text x="'+X(x.lng).toFixed(1)+'" y="'+(Y(x.lat)+4).toFixed(1)+'" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">'+(i+1)+'</text>'}).join("")+'</svg>';
app.innerHTML=h+'<div class="card" style="padding:8px">'+sv+'</div><div class="note" style="margin:0 0 12px">Tampilan posisi relatif antar titik, bukan peta jalan. Ketuk tautan untuk membuka peta asli.</div>'+p.map(function(x,i){return'<div class="card" style="display:flex;gap:12px;align-items:center"><div class="num">'+(i+1)+'</div><div style="flex:1;min-width:0"><b style="overflow-wrap:anywhere">'+esc(x.almt||x.ket||"Tanpa alamat")+'</b><div class="meta">'+esc(x.kec)+' · '+esc(x.apl)+'</div><a class="meta" target="_blank" rel="noopener" href="https://www.google.com/maps?q='+x.lat.toFixed(6)+','+x.lng.toFixed(6)+'">Buka di Google Maps ↗</a></div></div>'}).join("")}
